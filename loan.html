<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookNest — выдача книги</title>
</head>
<body>
    <header>
        <a href="index.html">BookNest</a>
        <nav aria-label="Основная навигация">
            <ul>
                <li><a href="index.html">Каталог</a></li>
                <li><a href="book.html">Карточка книги</a></li>
                <li><a href="loan.html" aria-current="page">Выдача книги</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Выдача книги</h1>

        <form action="loan.html" method="get">
            <fieldset>
                <legend>Читатель</legend>
                <p>
                    <label for="fullname">ФИО</label>
                    <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="100" autocomplete="name">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </p>
                <p>
                    <label for="phone">Телефон (только цифры, можно с +)</label>
                    <input type="tel" id="phone" name="phone" pattern="\+?[0-9]{10,15}" title="От 10 до 15 цифр, можно начать с +" autocomplete="tel">
                </p>
                <p>
                    <label for="ticket">Номер читательского билета (6 цифр)</label>
                    <input type="text" id="ticket" name="ticket" required pattern="[0-9]{6}" title="Ровно 6 цифр" inputmode="numeric">
                </p>
            </fieldset>

            <fieldset>
                <legend>Книга и срок</legend>
                <p>
                    <label for="book">Книга</label>
                    <select id="book" name="book" required>
                        <option value="">Выберите книгу</option>
                        <option value="1">Thousand Autumns Novel</option>
                        <option value="2">Under the Oak Tree</option>
                        <option value="3">Безмолвное чтение</option>
                        <option value="4">Небесная собака</option>
                        <option value="5">Несравненный</option>
                        <option value="6">Тысячи Осеней</option>
                    </select>
                </p>
                <p>
                    <label for="copies">Количество экземпляров</label>
                    <input type="number" id="copies" name="copies" required min="1" max="3" value="1">
                </p>
                <p>
                    <label for="date-from">Дата выдачи</label>
                    <input type="date" id="date-from" name="date_from" required>
                </p>
                <p>
                    <label for="date-to">Вернуть до</label>
                    <input type="date" id="date-to" name="date_to" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Получение</legend>
                <p>
                    <input type="radio" id="pickup-library" name="pickup" value="library" checked>
                    <label for="pickup-library">Заберу в библиотеке</label>
                </p>
                <p>
                    <input type="radio" id="pickup-dorm" name="pickup" value="dorm">
                    <label for="pickup-dorm">Доставка в общежитие</label>
                </p>
                <p>
                    <label for="comment">Комментарий</label>
                    <textarea id="comment" name="comment" maxlength="300" rows="4"></textarea>
                </p>
                <p>
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">Согласен с правилами пользования библиотекой</label>
                </p>
            </fieldset>

            <button type="submit">Оформить выдачу</button>
            <button type="reset">Очистить</button>
        </form>
    </main>

    <footer>
        <p>© 2026 BookNest — книжный клуб университета</p>
    </footer>
</body>
</html>
