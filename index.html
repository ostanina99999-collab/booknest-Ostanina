<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookNest — каталог книг</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
        <a class="site-header__brand" href="index.html">BookNest</a>
        <nav aria-label="Основная навигация">
            <ul>
                <li><a href="index.html" aria-current="page">Каталог</a></li>
                <li><a href="book.html">Карточка книги</a></li>
                <li><a href="loan.html">Выдача книги</a></li>
                <li><a href="#wishlist">Мой список (<span id="wish-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="page page--catalog">
        <h1>Каталог книг</h1>

        <form id="filters" class="form filters" action="index.html" method="get">
            <fieldset>
                <legend>Фильтры</legend>
                <p>
                    <label for="q">Поиск по названию или автору</label>
                    <input type="search" id="q" name="q" maxlength="100">
                </p>
                <p>
                    <label for="genre">Жанр</label>
                    <select id="genre" name="genre">
                        <option value="">Все жанры</option>
                        <option value="novel">Новелла</option>
                        <option value="romance">Романтика</option>
                        <option value="fantasy">Фэнтези</option>
                        <option value="detective">Детектив</option>
                        <option value="scifi">Фантастика</option>
                    </select>
                </p>
                <p>
                    <label for="sort">Сортировка</label>
                    <select id="sort" name="sort">
                        <option value="title">По названию (А–Я)</option>
                        <option value="year">По году (новые сначала)</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </p>
                <p>
                    <input type="checkbox" id="available" name="available" value="1">
                    <label for="available">Только доступные</label>
                </p>
                <button class="btn" type="button" data-action="reset">Сбросить фильтры</button>
            </fieldset>
        </form>

        <section class="results" aria-labelledby="results-title">
            <h2 id="results-title" aria-live="polite">Найдено книг: 0</h2>
            <p id="empty" hidden>
                Ничего не найдено. Измените запрос или
                <button class="btn" type="button" data-action="reset">сбросьте фильтры</button>.
            </p>
            <ul id="catalog"></ul>
        </section>

        <section id="wishlist" aria-labelledby="wishlist-title">
            <h2 id="wishlist-title">Мой список</h2>
            <p id="wishlist-empty">Пока пусто. Нажмите «Хочу прочитать» на карточке книги.</p>
            <ul id="wishlist-list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 BookNest — книжный клуб университета</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
